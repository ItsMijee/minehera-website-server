<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minehera - Top Kills Leaderboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 480px; background-color: #161b22; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #30363d; }
        h2 { text-align: center; margin-bottom: 24px; color: #f87171; font-size: 20px; letter-spacing: 1px; text-transform: uppercase; }
        .podium { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
        .card { flex: 1; background-color: #0d1117; border-radius: 12px; padding: 16px 8px; text-align: center; border: 1px solid #30363d; }
        .rank-1 { order: 2; border-color: #eab308; transform: scale(1.05); background: linear-gradient(180deg, #161b22 0%, #2e2305 100%); }
        .rank-2 { order: 1; border-color: #94a3b8; }
        .rank-3 { order: 3; border-color: #b45309; }
        .badge { font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 20px; display: inline-block; margin-bottom: 12px; }
        .rank-1 .badge { background-color: #eab308; color: #000; }
        .rank-2 .badge { background-color: #94a3b8; color: #000; }
        .rank-3 .badge { background-color: #b45309; color: #fff; }
        .avatar { width: 72px; height: 72px; margin: 0 auto 12px auto; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
        .username { font-weight: 700; font-size: 13px; word-break: break-all; margin-bottom: 4px; color: #f0f6fc; }
        .score { font-size: 12px; color: #8b949e; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚔ TOP 3 KILLS ⚔</h2>
        <div class="podium">
            <div class="card rank-2">
                <span class="badge">#2</span>
                <img id="avatar-2" class="avatar" src="https://visage.surgeplay.com/bust/128/MHF_Steve" alt="Skin">
                <div id="name-2" class="username">Loading...</div>
                <div id="score-2" class="score">0 Kills</div>
            </div>
            <div class="card rank-1">
                <span class="badge">👑 #1</span>
                <img id="avatar-1" class="avatar" src="https://visage.surgeplay.com/bust/128/MHF_Steve" alt="Skin">
                <div id="name-1" class="username">Loading...</div>
                <div id="score-1" class="score">0 Kills</div>
            </div>
            <div class="card rank-3">
                <span class="badge">#3</span>
                <img id="avatar-3" class="avatar" src="https://visage.surgeplay.com/bust/128/MHF_Steve" alt="Skin">
                <div id="name-3" class="username">Loading...</div>
                <div id="score-3" class="score">0 Kills</div>
            </div>
        </div>
    </div>

    <script>
        async function fetchLeaderboard() {
            try {
                const response = await fetch('/api/leaderboard');
                const data = await response.json();

                for (let i = 0; i < 3; i++) {
                    const rank = i + 1;
                    const player = data[i];

                    const nameEl = document.getElementById(`name-${rank}`);
                    const scoreEl = document.getElementById(`score-${rank}`);
                    const avatarEl = document.getElementById(`avatar-${rank}`);

                    if (player && player.playername) {
                        nameEl.innerText = player.playername;
                        scoreEl.innerText = `${player.value} Kills`;
                        avatarEl.src = `https://visage.surgeplay.com/bust/128/${player.playername}`;
                        
                        avatarEl.onerror = function() {
                            this.src = 'https://visage.surgeplay.com/bust/128/MHF_Steve';
                        };
                    }
                }
            } catch (err) {
                console.error("Gagal mengambil data:", err);
            }
        }
        fetchLeaderboard();
    </script>
</body>
</html>
